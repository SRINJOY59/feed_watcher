name: Watch

# Each run polls every POLL_SECONDS for ~5h45m (jobs are capped at 6h).
# GitHub's cron is unreliable (runs get delayed or dropped for hours), so the
# schedule only has to start a run now and then: one run is always queued
# behind the active one and takes over when it ends.
# When a new item appears it sends an alert and commits seen.json back so it
# remembers. When nothing is new, nothing is sent.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # lets you trigger a run by hand from the Actions tab

# Allow the job to push the updated state file back, and to keep itself enabled.
permissions:
  contents: write
  actions: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # GitHub disables scheduled workflows after 60 days without repo
      # activity; re-enabling via the API resets that timer.
      - name: Keep schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/watch.yml/enable" || true

      - name: Poll loop
        env:
          WATCH_URL: ${{ secrets.WATCH_URL }}
          WATCH_PAGE_URL: ${{ secrets.WATCH_PAGE_URL }}
          ALERT_SUBJECT: ${{ secrets.ALERT_SUBJECT }}
          NOTIFY_BACKEND: ${{ secrets.NOTIFY_BACKEND }}
          # --- Email (Gmail/SMTP) ---
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          # --- CallMeBot (free WhatsApp, personal) ---
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          # --- Twilio (WhatsApp, team / group) ---
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          TWILIO_TO: ${{ secrets.TWILIO_TO }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          POLL_SECONDS: "60"
          RUN_MINUTES: "345"
        run: |
          git config user.name "watch-bot"
          git config user.email "actions@github.com"
          end=$(( $(date +%s) + RUN_MINUTES * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            python watcher.py || echo "::warning::watcher error, retrying next poll"
            if ! git diff --quiet -- seen.json; then
              git add seen.json
              git commit -q -m "Update seen items [skip ci]"
              git pull -q --rebase && git push -q || echo "::warning::push failed, will retry"
            fi
            sleep "$POLL_SECONDS"
          done
