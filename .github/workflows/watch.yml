name: Watch

# One quick check per run. Runs are started every few minutes by an external
# scheduler (cron-job.org) calling the workflow_dispatch API, because GitHub's
# own cron is unreliable (runs get delayed or dropped for hours). The schedule
# below is only a backup.
# When a new item appears it sends an alert and commits seen.json back so it
# remembers. When nothing is new, nothing is sent.

on:
  workflow_dispatch: {}   # triggered by the external scheduler (or by hand)
  schedule:
    - cron: "*/15 * * * *"   # backup only

# Allow the job to push the updated state file back, and to keep itself enabled.
permissions:
  contents: write
  actions: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run watcher
        env:
          WATCH_URL: ${{ secrets.WATCH_URL }}
          WATCH_PAGE_URL: ${{ secrets.WATCH_PAGE_URL }}
          ALERT_SUBJECT: ${{ secrets.ALERT_SUBJECT }}
          NOTIFY_BACKEND: ${{ secrets.NOTIFY_BACKEND }}
          # --- Email (Gmail/SMTP) ---
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          # --- CallMeBot (free WhatsApp, personal) ---
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          # --- Twilio (WhatsApp, team / group) ---
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          TWILIO_TO: ${{ secrets.TWILIO_TO }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        run: python watcher.py

      - name: Commit updated state
        run: |
          git config user.name "watch-bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet -- seen.json; then
            git add seen.json
            git commit -m "Update seen items [skip ci]"
            git pull -q --rebase && git push
          else
            echo "No state change to commit."
          fi

      # GitHub disables workflows after 60 days without repo activity (and a
      # disabled workflow can't be dispatched); re-enabling resets that timer.
      - name: Keep workflow alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/watch.yml/enable" || true
